<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>Flat Expenses</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/static/vendor/pico.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <script type="module" src="/static/js/app.js"></script>
</head>
<body>
<main class="container">
<section id="login" class="login" hidden>
    <article class="login-card">
        <header>
            <img src="/static/favicon.svg" alt="" width="48" height="48">
            <h1>Flat Expenses</h1>
            <p class="muted">Shared costs, settled simply.</p>
        </header>
        <form id="login-form">
            <label>Name
                <input id="login-name" name="username" autocomplete="username" required autofocus>
            </label>
            <label>Password
                <span class="password-field">
                    <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                    <button type="button" id="toggle-password" class="link-button" aria-label="Show password">Show</button>
                </span>
            </label>
            <p id="login-error" class="message error" hidden></p>
            <button type="submit" id="login-submit">Log in</button>
        </form>
    </article>
</section>

<div id="dashboard" hidden></div>
</main>
</body>
</html>
