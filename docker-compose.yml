services:
  app:
    build: .
    image: flat-expenses:latest
    container_name: flat-expenses
    # Restart after crashes and after the server reboots (unless stopped by hand).
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Database + daily backups. Survives container rebuilds; `docker compose down -v` deletes it.
  data:
